<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>

<body>
  <div class="metricSlider glass">
    <div class="metricTemp temp active glass">
      Celisus
    </div>
    <div class="USTemp glass temp ">
      US
    </div>
  </div>

  <main class="weatherDataMainContainer glass">

    <form id="weatherDataRequestForm">
      <div>
        <input type="text" value="Egypt" name="cityName" placeholder="City Name..." class="glass"
          id="cityNameInput">
      </div>
      <input type="submit" value="Get Weather Data" class="glass">
    </form>
    <div class="weatherDataOverview">
      <div class="overlay">
        <div class="text">
          Enter a country name to get started
        </div>
        <div class="loader"></div>
      </div>
      <div class="locationAddress">
        Testing
      </div>
      <div class="mainTempOverview">
        <span class="temp">
          25
        </span>
      </div>
      <div class="pane glass">

      </div>
      <div class="details">
        <ul>
          <li>
            Feels like: <span class="feelsLike">shit</span>
          </li>
          <li>
            Wind Speed: <span class="windSpeed">12mph</span>
          </li>
          <li>
            Humidity: <span class="humidity">50%</span>
          </li>
          <li>
            UV index: <span class="UVIndex">200</span>
          </li>
        </ul>
      </div>
    </div>
  </main>
</body>

</html>
