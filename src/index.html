<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>

<body>
  <div class="metricSlider glass">
    <div class="metricTemp temp active glass">
      Celisus
    </div>
    <div class="USTemp glass temp ">
      US
    </div>
  </div>

  <main class="glass">

    <form id="weatherDataRequestFormElement">
      <div>
        <input type="text" value="Egypt" name="cityName" placeholder="City Name..." class="glass"
          id="cityNameInputElement">
      </div>
      <input type="submit" value="Get Weather Data" class="glass">
    </form>
    <div class="weatherDataViewContainerElement">
      <div class="overlay glass">
        <div class="text">
          Enter a country name to get started
        </div>
        <div class="loader"></div>

      </div>
      <div class="locationAddress">

      </div>
      <div class="westSide">
        <span class="temp">

        </span>
      </div>
      <div class="pane glass">

      </div>
      <div class="eastSide">
        <ul>
          <li>
            Feels like: <span class="feelsLike"></span>
          </li>
          <li>
            Wind Speed: <span class="windSpeed"></span>
          </li>
          <li>
            Humidity: <span class="humidity"></span>
          </li>
          <li>
            UV index: <span class="UVIndex"></span>
          </li>
        </ul>
      </div>
    </div>
  </main>
</body>

</html>
