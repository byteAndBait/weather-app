<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>

<body>
  <div class="metricSlider">
    <div class="metricTemp">
      Celisus
    </div>
    <div class="USTemp">
      US
    </div>
  </div>

  <main>

    <form id="weatherDataRequestFormElement">
      <div>
        <input type="text" name="cityName" placeholder="City Name..." id="cityNameInputElement">
      </div>
      <input type="submit" value="Get Weather Data">
    </form>
    <div class="weatherDataViewContainerElement">
      <div class="westSide">
        <span class="temp">
          70
        </span>
      </div>
      <div class="eastSide">
        <ul>
          <li>
            Feels like: <span class="feelsLike">50</span>
          </li>
          <li>
            Wind Speed: <span class="windSpeed">25mph</span>
          </li>
          <li>
            Humidity: <span class="humidity">23</span>
          </li>
          <li>
            UV index: <span class="UVIndex">2.9</span>
          </li>
        </ul>
      </div>
    </div>
  </main>
</body>

</html>
